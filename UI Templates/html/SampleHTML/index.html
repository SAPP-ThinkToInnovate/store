<html>
<link rel="stylesheet" href="index.css" />

<body>
    <div>
        <button id="click" onclick="clickHandler()">Click Me </button>
    </div>
    <script>
        function clickHandler(){
                const btn=document.getElementById("click")
                btn.innerText=btn.innerText==="Clicked"?"Click Me":"Clicked"
            }
    </script>
</body>

</html>
