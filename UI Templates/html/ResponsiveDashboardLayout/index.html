<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuantumNexus - Vanilla HTML Shell</title>
  <style>
    /* --- CSS Architecture & Design Tokens --- */
    :root {
      --bg-primary: #f8fafc;
      --bg-surface: #ffffff;
      --border-color: rgba(226, 232, 240, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary-color: #4f46e5;
      --primary-light: #e0e7ff;
      --sidebar-width-expanded: 260px;
      --sidebar-width-collapsed: 80px;
      --header-height: 64px;
      --transition-speed: 0.3s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- Base Layout Shell --- */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* --- Sidebar Navigation --- */
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: var(--sidebar-width-expanded);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      z-index: 50;
      transition: width var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    /* Sidebar Collapsed State Class */
    .app-shell.sidebar-collapsed .sidebar {
      width: var(--sidebar-width-collapsed);
    }

    .brand-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
    }

    .brand-logo-zone {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .logo-icon {
      display: flex;
      height: 36px;
      width: 36px;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background-color: var(--primary-color);
      color: white;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand-name {
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
      transition: opacity var(--transition-speed);
    }

    .app-shell.sidebar-collapsed .brand-name {
      opacity: 0;
      pointer-events: none;
      width: 0;
    }

    .nav-menu {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      list-style: none;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-item a:hover {
      background-color: #f8fafc;
      color: var(--text-main);
    }

    .nav-item.active a {
      background-color: var(--primary-light);
      color: var(--primary-color);
    }

    .nav-label {
      white-space: nowrap;
      transition: opacity var(--transition-speed);
    }

    .app-shell.sidebar-collapsed .nav-label {
      opacity: 0;
      pointer-events: none;
      width: 0;
    }

    .sidebar-widget {
      background-color: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      transition: opacity var(--transition-speed);
    }

    .app-shell.sidebar-collapsed .sidebar-widget {
      display: none;
    }

    .widget-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 6px;
      width: 100%;
      background-color: #e2e8f0;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 75%;
      background-color: var(--primary-color);
    }

    /* --- Main Canvas Wrapper --- */
    .main-runtime-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-left: var(--sidebar-width-expanded);
      transition: padding-left var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
    }

    .app-shell.sidebar-collapsed .main-runtime-wrapper {
      padding-left: var(--sidebar-width-collapsed);
    }

    /* --- Sticky Glassmorphic Header --- */
    .header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      height: var(--header-height);
      width: 100%;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0 24px;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      border: none;
      background: transparent;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    .search-wrapper {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    .search-input {
      height: 36px;
      width: 240px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background-color: rgba(248, 250, 252, 0.5);
      padding: 0 16px 0 36px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary-color);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .profile-zone {
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 1px solid var(--border-color);
      padding-left: 16px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-meta {
      display: block;
      text-align: left;
    }

    .profile-name {
      font-size: 14px;
      font-weight: 600;
    }

    .profile-role {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* --- Content Grid Canvas --- */
    .main-content {
      flex: 1;
      padding: 32px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .welcome-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 24px;
    }

    .welcome-card h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .welcome-card p {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* --- Responsive Mobile Overrides --- */
    @media (max-width: 1024px) {
      .sidebar {
        transform: translateX(-100%);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      }

      .main-runtime-wrapper,
      .app-shell.sidebar-collapsed .main-runtime-wrapper {
        padding-left: 0;
      }

      /* Mobile open drawer state */
      .app-shell.mobile-open .sidebar {
        transform: translateX(0);
        width: var(--sidebar-width-expanded) !important;
      }

      .app-shell.mobile-open .brand-name,
      .app-shell.mobile-open .nav-label,
      .app-shell.mobile-open .sidebar-widget {
        opacity: 1 !important;
        display: block !important;
        width: auto !important;
      }

      .search-wrapper, .profile-meta {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="app-shell" id="appShell">
    
    <aside class="sidebar">
      <div>
        <div class="brand-section">
          <a href="#" class="brand-logo-zone">
            <div class="logo-icon">Ω</div>
            <span class="brand-name">NexusApp</span>
          </a>
        </div>

        <ul class="nav-menu">
          <li class="nav-item active">
            <a href="#">
              <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
              <span class="nav-label">Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#">
              <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
              <span class="nav-label">Analytics</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#">
              <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
              <span class="nav-label">Team Space</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#">
              <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /></svg>
              <span class="nav-label">Configuration</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="sidebar-widget">
        <p class="widget-title">Workspace Data Space</p>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </aside>

    <div class="main-runtime-wrapper">
      
      <header class="header">
        <div class="header-left">
          <button class="icon-btn" id="toggleSidebarBtn">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          
          <div class="search-wrapper">
            <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
            <input type="text" placeholder="Search context matrices..." class="search-input" />
          </div>
        </div>

        <div class="header-right">
          <button class="icon-btn">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
          </button>
          
          <div class="profile-zone">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Avatar" class="avatar" />
            <div class="profile-meta">
              <p class="profile-name">Alex Morgan</p>
              <p class="profile-role">Lead Architect</p>
            </div>
          </div>
        </div>
      </header>

      <main class="main-content">
        <div class="container">
          <div class="welcome-card">
            <h1>Workspace Overview</h1>
            <p>Welcome back! Here is a summary look at your current environmental tracking variables.</p>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script>
    const appShell = document.getElementById('appShell');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');

    toggleSidebarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.innerWidth > 1024) {
        // Toggle desktop collapsed mode
        appShell.classList.toggle('sidebar-collapsed');
      } else {
        // Toggle mobile drawer mode
        appShell.classList.toggle('mobile-open');
      }
    });

    // Close mobile side drawer when clicking outside the canvas menu boundaries
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 1024 && !e.target.closest('.sidebar') && appShell.classList.contains('mobile-open')) {
        appShell.classList.remove('mobile-open');
      }
    });
  </script>
</body>
</html>
