<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphism Card</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
      overflow: hidden;
      position: relative;
    }

    /* Background blobs */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
    }

    body::before {
      background: #8b5cf6;
      top: -80px;
      left: -80px;
    }

    body::after {
      background: #06b6d4;
      bottom: -100px;
      right: -80px;
    }

    .card {
      width: 350px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      text-align: center;
      color: white;
      position: relative;
      z-index: 1;
      transition: transform 0.4s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
    }

    .profile {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 20px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .primary {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
    }

    .primary:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
    }

    .secondary {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="profile">
      <img src="https://i.pravatar.cc/300" alt="Profile">
    </div>

    <h2>Suriya</h2>

    <p>
      MERN Stack Developer passionate about building modern,
      scalable, and beautiful web applications.
    </p>

    <div class="buttons">
      <button class="btn primary">Follow</button>
      <button class="btn secondary">Message</button>
    </div>
  </div>

</body>
</html>
